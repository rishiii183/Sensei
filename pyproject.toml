[project]
name = "sensei"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rishiii183", email = "rishiii183@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "litellm>=1.110.2",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.9",
    "typer>=0.29.2",
]

[project.scripts]
sensei = "sensei.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
